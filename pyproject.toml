[project]
name = "solidworks-automation-skill"
version = "1.3.0"
description = "Local MCP server for controlled SolidWorks and CAD Studio automation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "wzyn20051216" }
]
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.0",
  "ezdxf>=1.3,<2",
  "matplotlib>=3.8,<4",
  "PyMuPDF>=1.24,<2",
  "jsonschema>=4.20,<5",
  "pywin32>=305; sys_platform == 'win32'",
  "comtypes>=1.2.0; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/wzyn20051216/solidworks-automation-skill"
Repository = "https://github.com/wzyn20051216/solidworks-automation-skill"
Issues = "https://github.com/wzyn20051216/solidworks-automation-skill/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# 统计范围: 核心脚本库、MCP 服务器、桌面端(含 GUI)、subskills 脚本。
# tests/、examples/、src-tauri/resources/skill 镜像副本均在 source 之外, 天然不计入。
source = ["scripts", "mcp-server", "apps/desktop", "subskills"]
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
# 全语言口径中的 Python 门禁: 语句+分支均须 100%
fail_under = 100
show_missing = true
skip_empty = true
